[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "curvquant"
version = "0.1.0"
description = "Curvature quantiles, curvature-mass profiles and curvature-quantile resampling for planar curves"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Michael J. Wish"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8", "pandas>=2.0"]
test = ["pytest>=7"]
realdata = ["pandas>=2.0", "shapely>=2.0", "gpxpy>=1.5", "ezdxf>=1.1"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["curvquant*", "realbench*"]
